# CNS DaemonSet with embedded CNI installer — no init container.
#
# This manifest deploys the embed-CNI variant of azure-cns. The CNS
# binary includes the CNI plugin binaries (azure-vnet, azure-vnet-ipam,
# azure-vnet-telemetry) embedded via //go:embed. On startup, CNS writes
# them to /opt/cni/bin/ before proceeding with the normal daemon bootstrap.
#
# The init container ("cni-installer") is NOT needed. This removes the
# kubelet pod-sync waterfall between init-exit and main-start, which
# costs 4-9 seconds on AKS nodes during the DaemonSet boot stampede.
#
# Usage:
#   1. Build and push the embed-CNI image:
#        docker build -t acnpublic.azurecr.io/azure-cns:<tag> -f cns/Dockerfile .
#        az acr login -n acnpublic && docker push acnpublic.azurecr.io/azure-cns:<tag>
#   2. Update the image tag below.
#   3. Apply RBAC + ConfigMap first:
#        kubectl apply -f test-staticpod/clusterrole.yaml
#        kubectl apply -f test-staticpod/rolebinding.yaml
#        kubectl apply -f test-staticpod/overlayconfigmap.yaml
#   4. kubectl apply -f deploy/examples/cns-embed-cni-daemonset.yaml
#
# For a BYOCNI Overlay cluster created via:
#   make -C hack/aks overlay-byocni-up CLUSTER=... VM_SIZE=Standard_B12ms
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: azure-cns
  namespace: kube-system
  labels:
    app: azure-cns
spec:
  selector:
    matchLabels:
      k8s-app: azure-cns
  template:
    metadata:
      labels:
        k8s-app: azure-cns
      annotations:
        cluster-autoscaler.kubernetes.io/daemonset-pod: "true"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.azure.com/cluster
                operator: Exists
              - key: type
                operator: NotIn
                values:
                - virtual-kubelet
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
      priorityClassName: system-node-critical
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
        - operator: Exists
          effect: NoExecute
        - operator: Exists
          effect: NoSchedule
      # NOTE: No initContainers — CNS deploys CNI binaries inline during bootstrap.
      containers:
        - name: cns-container
          image: acnpublic.azurecr.io/azure-cns:v0.0.4-embed-cni-20260519-2000
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "tcp://$(CNSIpAddress):$(CNSPort)"
            - "-t"
            - "$(CNSLogTarget)"
          securityContext:
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - NET_RAW
          volumeMounts:
            - name: log
              mountPath: /var/log
            - name: cns-state
              mountPath: /var/lib/azure-network
            - name: azure-endpoints
              mountPath: /var/run/azure-cns/
            - name: cns-config
              mountPath: /etc/azure-cns
            - name: cni-bin
              mountPath: /opt/cni/bin
            - name: azure-vnet
              mountPath: /var/run/azure-vnet
            - name: legacy-cni-state
              mountPath: /var/run/azure-vnet.json
            - name: xtables-lock
              mountPath: /run/xtables.lock
            - name: cni-conflist
              mountPath: /etc/cni/net.d
          ports:
            - containerPort: 10090
            - containerPort: 10092
              name: metrics
              protocol: TCP
          env:
            - name: CNSIpAddress
              value: "127.0.0.1"
            - name: CNSPort
              value: "10090"
            - name: CNSLogTarget
              value: "stdoutfile"
            - name: CNS_CONFIGURATION_PATH
              value: /etc/azure-cns/cns_config.json
            - name: NODENAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
      hostNetwork: true
      volumes:
        - name: cni-conflist
          hostPath:
            path: /etc/cni/net.d
            type: Directory
        - name: azure-endpoints
          hostPath:
            path: /var/run/azure-cns/
            type: DirectoryOrCreate
        - name: log
          hostPath:
            path: /var/log
            type: Directory
        - name: cns-state
          hostPath:
            path: /var/lib/azure-network
            type: DirectoryOrCreate
        - name: cni-bin
          hostPath:
            path: /opt/cni/bin
            type: Directory
        - name: azure-vnet
          hostPath:
            path: /var/run/azure-vnet
            type: DirectoryOrCreate
        - name: legacy-cni-state
          hostPath:
            path: /var/run/azure-vnet.json
            type: FileOrCreate
        - name: cns-config
          configMap:
            name: cns-config
        - name: xtables-lock
          hostPath:
            path: /run/xtables.lock
            type: File
      serviceAccountName: azure-cns
